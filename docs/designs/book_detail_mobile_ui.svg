<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 1180" width="393" height="1180" style="background-color: #FDFDFD; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="cover-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="fab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#01C54F" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5A44"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Mobile Viewport Frame (393 x 1180 total content, Viewport height 852px) -->
  <rect width="393" height="1180" fill="#FDFDFD"/>

  <!-- TOP HEADER NAV BAR (Mobile 393px width) -->
  <g id="MobileHeader" transform="translate(0, 0)">
    <rect width="393" height="56" fill="#FFFFFF"/>
    <line x1="0" y1="56" x2="393" y2="56" stroke="#F1F5F9" stroke-width="1"/>
    
    <!-- Back Button -->
    <g transform="translate(16, 16)">
      <path d="M 12 4 L 4 12 L 12 20" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Header Title -->
    <text x="52" y="32" fill="#0F172A" font-size="16" font-weight="800">도서 상세 정보</text>
    
    <!-- Share / Bookmark Action -->
    <g transform="translate(345, 16)">
      <circle cx="12" cy="12" r="14" fill="#F8FAFC"/>
      <path d="M 12 6 C 9.5 6 8 7.5 8 10 L 8 12 L 6 14 L 18 14 L 16 12 L 16 10 Z" fill="#64748B"/>
    </g>
  </g>

  <!-- MAIN SCROLLABLE CONTENT AREA (Width: 393px) -->
  <g id="MobileContent" transform="translate(16, 72)">

    <!-- 1. MAIN BOOK OVERVIEW CARD (Mobile Stacked Layout) -->
    <g id="BookOverviewCard" transform="translate(0, 0)">
      <rect width="361" height="425" rx="28" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" filter="url(#card-shadow)"/>

      <!-- Book Cover Image Centered -->
      <g transform="translate(110, 24)">
        <rect width="141" height="190" rx="14" fill="url(#coverGrad)" filter="url(#cover-shadow)"/>
        <!-- Book Spine Detail -->
        <rect x="0" y="0" width="10" height="190" rx="3" fill="#000000" fill-opacity="0.15"/>
        <!-- Book Title Art -->
        <text x="75" y="80" fill="#FFFFFF" font-size="16" font-weight="900" text-anchor="middle">용기를 내,</text>
        <text x="75" y="105" fill="#FACC15" font-size="18" font-weight="900" text-anchor="middle">비버!</text>
        <!-- Circle icon -->
        <circle cx="75" cy="135" r="16" fill="#FFFFFF" fill-opacity="0.2"/>
        <path d="M 68 135 C 68 128 82 128 82 135 Z" fill="#FFFFFF"/>
        <text x="75" y="175" fill="#FFFFFF" fill-opacity="0.8" font-size="9" font-weight="600" text-anchor="middle">Book,ok 추천</text>
      </g>

      <!-- Category & Action Buttons -->
      <g transform="translate(20, 228)">
        <!-- Category Badge -->
        <rect width="84" height="26" rx="13" fill="#DCFCE7"/>
        <text x="42" y="17" fill="#15803D" font-size="11" font-weight="900" text-anchor="middle">유아 그림책</text>

        <!-- Action Buttons Group (Scrap & Read) -->
        <g transform="translate(165, 0)">
          <!-- Scrap Button -->
          <rect x="0" y="0" width="76" height="28" rx="14" fill="#FEF9C3" stroke="#FEF08A" stroke-width="1"/>
          <path d="M 12 7 L 19 7 L 19 19 L 15.5 17 L 12 19 Z" fill="#CA8A04"/>
          <text x="44" y="18" fill="#854D0E" font-size="11" font-weight="800" text-anchor="middle">찜 완료</text>

          <!-- Read Button -->
          <rect x="82" y="0" width="74" height="28" rx="14" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1"/>
          <path d="M 91 14 L 95 18 L 102 9" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
          <text x="124" y="18" fill="#15803D" font-size="11" font-weight="800" text-anchor="middle">읽은 책</text>
        </g>
      </g>

      <!-- Book Title & Meta -->
      <g transform="translate(20, 268)">
        <text x="0" y="20" fill="#0F172A" font-size="20" font-weight="900">용기를 내, 비버!</text>
        <text x="0" y="40" fill="#64748B" font-size="12" font-weight="600">니콜라스 홀드게이트 (글/그림) · 2023.04.15</text>

        <!-- Rating Pill -->
        <g transform="translate(230, 4)">
          <rect width="90" height="24" rx="8" fill="#F8FAFC" stroke="#F1F5F9"/>
          <text x="8" y="16" fill="#F59E0B" font-size="12">★</text>
          <text x="22" y="16" fill="#0F172A" font-size="11" font-weight="800">4.9</text>
          <text x="44" y="16" fill="#94A3B8" font-size="10" font-weight="600">(128개)</text>
        </g>

        <!-- Description Text (Mobile 3-line wrap) -->
        <text x="0" y="66" fill="#334155" font-size="12" font-weight="500" leading="1.5">
          <tspan x="0" dy="0">새로운 도전을 두려워하는 아이들에게 용기와 자신감을</tspan>
          <tspan x="0" dy="18">전해주는 이야기입니다. 비버 꼬미가 처음으로 홀로</tspan>
          <tspan x="0" dy="18">강을 건너며 성장의 기쁨을 배우게 됩니다.</tspan>
        </text>
      </g>
    </g>

    <!-- 2. NEIGHBORHOOD LIBRARY HOLDING STATUS CARD (Mobile Layout) -->
    <g id="LibraryHoldingCard" transform="translate(0, 441)">
      <rect width="361" height="210" rx="28" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" filter="url(#card-shadow)"/>
      
      <!-- Card Header -->
      <g transform="translate(16, 16)">
        <rect width="32" height="32" rx="10" fill="#F0FDF4"/>
        <path d="M 16 10 C 13 10 10.5 12.5 10.5 15.5 C 10.5 19.5 16 23.5 16 23.5 C 16 23.5 21.5 19.5 21.5 15.5 C 21.5 12.5 19 10 16 10 Z" fill="#16A34A"/>
        <text x="42" y="21" fill="#0F172A" font-size="15" font-weight="800">우리 동네 도서관 소장 현황</text>
      </g>

      <!-- Library Status Items -->
      <g transform="translate(16, 60)">
        <!-- Library Item 1 (Loanable) -->
        <g transform="translate(0, 0)">
          <rect width="329" height="58" rx="16" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1"/>
          <circle cx="24" cy="29" r="14" fill="#FFFFFF"/>
          <path d="M 19 33 L 19 25 L 29 25 L 29 33 Z M 22 27 L 26 27" fill="none" stroke="#16A34A" stroke-width="1.5"/>
          
          <text x="48" y="24" fill="#0F172A" font-size="13" font-weight="800">국립중앙도서관</text>
          <text x="48" y="40" fill="#94A3B8" font-size="10" font-weight="500">코드: 111001 · 서초구 반포대로</text>

          <!-- Loanable Badge -->
          <rect x="245" y="15" width="70" height="28" rx="8" fill="#16A34A"/>
          <text x="280" y="33" fill="#FFFFFF" font-size="11" font-weight="900" text-anchor="middle">대출 가능</text>
        </g>

        <!-- Library Item 2 (Checked out) -->
        <g transform="translate(0, 68)">
          <rect width="329" height="58" rx="16" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1"/>
          <circle cx="24" cy="29" r="14" fill="#FFFFFF"/>
          <path d="M 19 33 L 19 25 L 29 25 L 29 33 Z M 22 27 L 26 27" fill="none" stroke="#16A34A" stroke-width="1.5"/>
          
          <text x="48" y="24" fill="#0F172A" font-size="13" font-weight="800">강남도서관</text>
          <text x="48" y="40" fill="#94A3B8" font-size="10" font-weight="500">코드: 111002 · 강남구 선릉로</text>

          <!-- Checked Out Badge -->
          <rect x="245" y="15" width="70" height="28" rx="8" fill="#FFEDD5" stroke="#FED7AA" stroke-width="1"/>
          <text x="280" y="33" fill="#C2410C" font-size="11" font-weight="900" text-anchor="middle">대출중</text>
        </g>
      </g>
    </g>

    <!-- 3. REVIEWS SECTION (Mobile Layout) -->
    <g id="ReviewsSection" transform="translate(0, 667)">
      <text x="0" y="22" fill="#0F172A" font-size="17" font-weight="900">리뷰 (3)</text>

      <!-- Review Input Box -->
      <g transform="translate(0, 34)">
        <rect width="361" height="135" rx="20" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1.5"/>
        
        <!-- Stars -->
        <g transform="translate(16, 14)">
          <text x="0" y="16" fill="#F59E0B" font-size="16">★★★★★</text>
          <text x="96" y="14" fill="#64748B" font-size="11" font-weight="600">별점을 선택하세요</text>
        </g>

        <!-- Textarea Mock -->
        <rect x="16" y="38" width="329" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="28" y="63" fill="#94A3B8" font-size="11">이 책에 대한 평을 남겨주세요...</text>

        <!-- Submit Button -->
        <rect x="265" y="90" width="80" height="30" rx="8" fill="#16A34A"/>
        <text x="305" y="109" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">리뷰 등록</text>
      </g>

      <!-- Review Items -->
      <g transform="translate(0, 185)">
        <!-- Item 1 -->
        <g transform="translate(0, 0)">
          <rect width="361" height="84" rx="18" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
          <circle cx="28" cy="28" r="14" fill="#DCFCE7"/>
          <text x="28" y="33" fill="#15803D" font-size="12" font-weight="900" text-anchor="middle">민</text>
          
          <text x="50" y="26" fill="#0F172A" font-size="13" font-weight="800">민준맘</text>
          <text x="98" y="26" fill="#F59E0B" font-size="12">★★★★★</text>
          <text x="345" y="26" fill="#94A3B8" font-size="10" text-anchor="end">2026.08.02</text>

          <text x="50" y="50" fill="#334155" font-size="11">아이가 너무 재미있게 읽었어요! 그림체도 귀엽고 용기에 대해 배우기 좋은 책입니다.</text>
        </g>

        <!-- Item 2 -->
        <g transform="translate(0, 94)">
          <rect width="361" height="84" rx="18" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
          <circle cx="28" cy="28" r="14" fill="#DBEAFE"/>
          <text x="28" y="33" fill="#1E40AF" font-size="12" font-weight="900" text-anchor="middle">서</text>
          
          <text x="50" y="26" fill="#0F172A" font-size="13" font-weight="800">서연아빠</text>
          <text x="108" y="26" fill="#F59E0B" font-size="12">★★★★☆</text>
          <text x="345" y="26" fill="#94A3B8" font-size="10" text-anchor="end">2026.07.28</text>

          <text x="50" y="50" fill="#334155" font-size="11">5세 아이 잠자리 동화로 읽어주기 딱 좋은 책입니다.</text>
        </g>
      </g>
    </g>

  </g>

  <!-- FIXED MOBILE BOTTOM NAVIGATION BAR (Width: 393px) -->
  <g id="MobileBottomNav" transform="translate(0, 1100)">
    <rect width="393" height="80" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    
    <!-- Tab 1: Home -->
    <g transform="translate(36, 16)">
      <path d="M 12 6 L 4 13 L 4 22 L 20 22 L 20 13 Z" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
      <text x="12" y="34" fill="#94A3B8" font-size="10" font-weight="700" text-anchor="middle">홈</text>
    </g>

    <!-- Tab 2: AI 독서 -->
    <g transform="translate(108, 16)">
      <path d="M 6 8 L 18 8 L 18 20 L 6 20 Z M 10 12 L 14 12 M 10 16 L 14 16" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
      <text x="12" y="34" fill="#94A3B8" font-size="10" font-weight="700" text-anchor="middle">AI 독서</text>
    </g>

    <!-- Tab 3: Center FAB (AI 사서) -->
    <g transform="translate(170, -16)">
      <circle cx="26" cy="26" r="26" fill="#01C54F" filter="url(#fab-shadow)" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="26" cy="22" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="23" cy="20" r="1.5" fill="#FFFFFF"/>
      <circle cx="29" cy="20" r="1.5" fill="#FFFFFF"/>
      <path d="M 23 25 Q 26 27 29 25" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="26" y="66" fill="#01C54F" font-size="10" font-weight="900" text-anchor="middle">AI 사서</text>
    </g>

    <!-- Tab 4: 커뮤니티 -->
    <g transform="translate(260, 16)">
      <path d="M 6 18 C 6 15 18 15 18 18 M 12 14 C 14 14 15 12 15 10 C 15 8 14 7 12 7 C 10 7 9 8 9 10 C 9 12 10 14 12 14 Z" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
      <text x="12" y="34" fill="#94A3B8" font-size="10" font-weight="700" text-anchor="middle">커뮤니티</text>
    </g>

    <!-- Tab 5: MY -->
    <g transform="translate(332, 16)">
      <circle cx="12" cy="10" r="4" fill="#94A3B8"/>
      <path d="M 5 22 C 5 17 19 17 19 22" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
      <text x="12" y="34" fill="#94A3B8" font-size="10" font-weight="700" text-anchor="middle">MY</text>
    </g>

  </g>
</svg>
