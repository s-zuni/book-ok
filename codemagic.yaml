workflows:
  capacitor-ios:
    name: iOS Build & App Store Upload
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "seung jun"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bookok.kr"
      node: 22
      xcode: 16.2
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          npx patch-package
          node -e "const fs=require('fs');const p='node_modules/@capacitor-community/apple-sign-in/Package.swift';if(fs.existsSync(p)){let c=fs.readFileSync(p,'utf8');c=c.replace('7.0.0','8.0.0');fs.writeFileSync(p,c);console.log('✅ Apple Sign In Package.swift patched to 8.0.0');}"
          echo "=== Debug: Package.swift content ==="
          if [ -f node_modules/@capacitor-community/apple-sign-in/Package.swift ]; then
            cat node_modules/@capacitor-community/apple-sign-in/Package.swift
          else
            echo "Package.swift not found"
          fi
      - name: Build Web App
        script: |
          npm run build:cap
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
          node scripts/fix-spm-path.js
      - name: Check and Inject GoogleService-Info.plist
        script: |
          echo "=== GoogleService-Info.plist Check ==="
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
            echo "✅ Injected GoogleService-Info.plist from Codemagic Environment Variable!"
          fi

          if [ -f ios/App/App/GoogleService-Info.plist ]; then
            echo "✅ GoogleService-Info.plist exists at ios/App/App/GoogleService-Info.plist"
          else
            echo "⚠️ WARNING: GoogleService-Info.plist is MISSING in ios/App/App/!"
            echo "Please commit it to Git or set GOOGLE_SERVICE_INFO_PLIST_BASE64 in Codemagic Environment Variables."
          fi
      - name: Set up code signing
        script: |
          keychain initialize

          echo "=== 1. 개인 키 생성 ==="
          openssl genrsa -out /tmp/ios.key 2048
          echo "✅ 개인 키 생성 완료"

          echo "=== 2. Apple API로 인증서 생성 및 임시 저장 ==="
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key "@file:/tmp/ios.key" \
            --save \
            --p12-path /tmp/ios_temp.p12 \
            --p12-password "1234" \
            --verbose

          echo "=== 3. macOS용 Legacy .p12 형식으로 재인코딩 ==="
          openssl pkcs12 -in /tmp/ios_temp.p12 -nodes -passin pass:"1234" -out /tmp/ios.pem
          openssl pkcs12 -export -legacy -in /tmp/ios.pem -out /tmp/ios.p12 -passout pass:"1234"
          rm /tmp/ios.pem
          echo "✅ Legacy .p12 변환 완료"

          echo "=== 4. Xcode 인증서 디렉토리로 파일 복사 ==="
          mkdir -p ~/Library/Developer/Xcode/UserData/Certificates
          mkdir -p ~/Library/MobileDevice/Certificates
          cp /tmp/ios.p12 ~/Library/Developer/Xcode/UserData/Certificates/
          cp /tmp/ios.p12 ~/Library/MobileDevice/Certificates/
          echo "✅ 인증서 파일 배치 완료"

          echo "=== 5. 키체인에 인증서 추가 ==="
          keychain add-certificates --certificate /tmp/ios.p12 --certificate-password "1234"

          echo "=== 5-1. codesign 키체인 무인증 접근 권한 부여 (GUI 팝업 차단) ==="
          DEFAULT_KEYCHAIN=$(security default-keychain 2>/dev/null | tr -d '"' | sed -e 's/^[ \t]*//')
          if [ -n "$DEFAULT_KEYCHAIN" ]; then
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "1234" "$DEFAULT_KEYCHAIN" 2>/dev/null || true
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "1234" ~/Library/Keychains/build.keychain-db 2>/dev/null || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "1234" /Users/builder/Library/Keychains/build.keychain-db 2>/dev/null || true

          echo "=== 6. 프로비저닝 프로파일 가져오기 ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:/tmp/ios.key" \
            --p12-password "1234" \
            --create

      - name: Increment build number
        script: |
          echo "=== App Store Connect 최신 빌드 번호 조회 및 자동 증가 ==="
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "")
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" = "null" ]; then
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo "44")
          fi
          
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            LATEST_BUILD_NUMBER=44
          fi

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "✅ 빌드 번호 갱신: 기존 ($LATEST_BUILD_NUMBER) -> 신규 ($NEW_BUILD_NUMBER)"
          
          cd ios/App
          agvtool new-version -all "$NEW_BUILD_NUMBER"
          cd ../..

      - name: Build iOS App
        script: |
          echo "=== 0. SPM 자동 해석 허용 및 캐시 정리 ==="
          defaults write com.apple.dt.Xcode IDEPackageOnlyUseVersionsFromResolvedFile -bool NO
          defaults write com.apple.dt.Xcode IDEDisableAutomaticPackageResolution -bool NO
          rm -rf ~/Library/Developer/Xcode/DerivedData

          echo "=== 1. SPM 패키지 의존성 해결 (Scheme 명시) ==="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -disablePackageRepositoryCache

          echo "=== 2. Xcode 프로젝트에 프로파일 적용 및 Export Options 생성 ==="
          xcode-project use-profiles --project "$XCODE_PROJECT"

          echo "=== 2-1. SPM 패키지 서명 충돌 방지 처리 (프로젝트 레벨 서명 격리) ==="
          node scripts/fix-spm-signing.js

          echo "=== 3. IPA 빌드 ==="
          if ! xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"; then
            echo "❌ xcode-project build-ipa 실패! 상세 컴파일/빌드 에러를 진단합니다."
            xcodebuild archive \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -destination "generic/platform=iOS" \
              -archivePath "build/ios/xcarchive/App.xcarchive" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              DEVELOPMENT_TEAM=7AB2D79572 \
              2>&1 | tee /tmp/xcodebuild.log | grep -E "error:|fatal error:|warning: App isn't code signed" || true
            
            echo "=== 마지막 50줄 출력 ==="
            tail -n 50 /tmp/xcodebuild.log
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
