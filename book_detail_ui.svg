<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" width="1000" height="1180" style="background-color: #FDFDFD; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="cover-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5A44"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="1180" fill="#FDFDFD"/>

  <!-- TOP HEADER / BACK NAVIGATION -->
  <g transform="translate(60, 40)">
    <!-- Back Button -->
    <g transform="translate(0, 0)">
      <path d="M 12 6 L 4 14 L 12 22" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="18" fill="#64748B" font-size="15" font-weight="700">목록으로 돌아가기</text>
    </g>

    <!-- 1. MAIN BOOK OVERVIEW CARD -->
    <g id="BookOverviewCard" transform="translate(0, 40)">
      <rect width="880" height="340" rx="40" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" filter="url(#card-shadow)"/>
      
      <!-- Book Cover Image Mockup -->
      <g transform="translate(40, 40)">
        <rect width="190" height="260" rx="16" fill="url(#coverGrad)" filter="url(#cover-shadow)"/>
        <!-- Book Spine Detail -->
        <rect x="0" y="0" width="14" height="260" rx="4" fill="#000000" fill-opacity="0.15"/>
        <!-- Book Title Art -->
        <text x="105" y="110" fill="#FFFFFF" font-size="22" font-weight="900" text-anchor="middle">용기를 내,</text>
        <text x="105" y="145" fill="#FACC15" font-size="24" font-weight="900" text-anchor="middle">비버!</text>
        <!-- Illustration Placeholder icon -->
        <circle cx="105" cy="185" r="22" fill="#FFFFFF" fill-opacity="0.2"/>
        <path d="M 95 185 C 95 175 115 175 115 185 C 115 195 95 195 95 185 Z" fill="#FFFFFF"/>
        <!-- Publisher Badge on Cover -->
        <text x="105" y="240" fill="#FFFFFF" fill-opacity="0.8" font-size="10" font-weight="600" text-anchor="middle">Book,ok 추천도서</text>
      </g>

      <!-- Book Info Content -->
      <g transform="translate(260, 40)">
        <!-- Category & Action Buttons Bar -->
        <g transform="translate(0, 0)">
          <!-- Category Badge -->
          <rect width="90" height="30" rx="15" fill="#DCFCE7"/>
          <text x="45" y="20" fill="#15803D" font-size="12" font-weight="900" text-anchor="middle">유아 그림책</text>

          <!-- Action Buttons Group -->
          <g transform="translate(380, 0)">
            <!-- Scrap Button (Scrapped state) -->
            <rect x="0" y="0" width="105" height="36" rx="18" fill="#FEF9C3" stroke="#FEF08A" stroke-width="1.5"/>
            <path d="M 18 10 L 28 10 L 28 26 L 23 23 L 18 26 Z" fill="#CA8A04" stroke="#CA8A04" stroke-width="1"/>
            <text x="60" y="23" fill="#854D0E" font-size="13" font-weight="800" text-anchor="middle">찜 완료</text>

            <!-- Read Button (Read state) -->
            <rect x="115" y="0" width="105" height="36" rx="18" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1.5"/>
            <path d="M 128 18 L 134 24 L 144 12" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
            <text x="175" y="23" fill="#15803D" font-size="13" font-weight="800" text-anchor="middle">읽은 책</text>
          </g>
        </g>

        <!-- Book Title -->
        <text x="0" y="70" fill="#0F172A" font-size="28" font-weight="900">용기를 내, 비버!</text>
        
        <!-- Author & Metadata -->
        <text x="0" y="100" fill="#64748B" font-size="14" font-weight="600">니콜라스 홀드게이트 (글/그림)  |  출판일: 2023-04-15  |  웅진주니어</text>
        
        <!-- Divider -->
        <line x1="0" y1="120" x2="580" y2="120" stroke="#F1F5F9" stroke-width="1.5"/>

        <!-- Description -->
        <text x="0" y="146" fill="#334155" font-size="14" font-weight="500" leading="1.6">
          <tspan x="0" dy="0">새로운 도전을 두려워하는 아이들에게 용기와 자신감을 전해주는 따뜻한 이야기책입니다.</tspan>
          <tspan x="0" dy="24">작은 비버 꼬미가 처음으로 홀로 강을 건너며 만나는 친구들과의 에피소드를 통해</tspan>
          <tspan x="0" dy="24">스스로 문제를 해결해 나가는 성장의 기쁨을 배우게 됩니다.</tspan>
        </text>

        <!-- Rating Overview Pill -->
        <g transform="translate(0, 220)">
          <rect width="180" height="36" rx="12" fill="#F8FAFC" stroke="#F1F5F9"/>
          <!-- Star icons -->
          <text x="14" y="23" fill="#F59E0B" font-size="16">★★★★★</text>
          <text x="105" y="23" fill="#0F172A" font-size="13" font-weight="800">4.9</text>
          <text x="135" y="23" fill="#94A3B8" font-size="12" font-weight="600">(128개)</text>
        </g>
      </g>
    </g>

    <!-- 2. NEIGHBORHOOD LIBRARY HOLDING STATUS CARD -->
    <g id="LibraryHoldingCard" transform="translate(0, 410)">
      <rect width="880" height="260" rx="40" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" filter="url(#card-shadow)"/>
      
      <!-- Section Header -->
      <g transform="translate(40, 36)">
        <rect width="40" height="40" rx="12" fill="#F0FDF4"/>
        <path d="M 20 12 C 16 12 13 15 13 19 C 13 24 20 29 20 29 C 20 29 27 24 27 19 C 27 15 24 12 20 12 Z" fill="#16A34A"/>
        <circle cx="20" cy="18" r="2.5" fill="#FFFFFF"/>
        <text x="56" y="26" fill="#0F172A" font-size="20" font-weight="800">우리 동네 도서관 소장 현황</text>
      </g>

      <!-- Library List Items Grid -->
      <g transform="translate(40, 96)">
        <!-- Library Item 1 (Loanable) -->
        <g transform="translate(0, 0)">
          <rect width="800" height="60" rx="18" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1"/>
          <circle cx="36" cy="30" r="16" fill="#FFFFFF"/>
          <path d="M 28 36 L 28 26 L 44 26 L 44 36 Z M 32 29 L 40 29 M 32 32 L 40 32" fill="none" stroke="#16A34A" stroke-width="1.8"/>
          
          <text x="68" y="28" fill="#0F172A" font-size="15" font-weight="800">국립중앙도서관</text>
          <text x="68" y="45" fill="#94A3B8" font-size="11" font-weight="500">도서관 코드: 111001  |  서울 서초구 반포대로 201</text>

          <!-- Loanable Badge -->
          <rect x="680" y="15" width="90" height="30" rx="8" fill="#16A34A"/>
          <text x="725" y="35" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">대출 가능</text>
        </g>

        <!-- Library Item 2 (Checked out) -->
        <g transform="translate(0, 72)">
          <rect width="800" height="60" rx="18" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1"/>
          <circle cx="36" cy="30" r="16" fill="#FFFFFF"/>
          <path d="M 28 36 L 28 26 L 44 26 L 44 36 Z M 32 29 L 40 29 M 32 32 L 40 32" fill="none" stroke="#16A34A" stroke-width="1.8"/>
          
          <text x="68" y="28" fill="#0F172A" font-size="15" font-weight="800">강남도서관</text>
          <text x="68" y="45" fill="#94A3B8" font-size="11" font-weight="500">도서관 코드: 111002  |  서울 강남구 선릉로 116길 45</text>

          <!-- Checked Out Badge -->
          <rect x="680" y="15" width="90" height="30" rx="8" fill="#FFEDD5" stroke="#FED7AA" stroke-width="1"/>
          <text x="725" y="35" fill="#C2410C" font-size="12" font-weight="900" text-anchor="middle">대출중</text>
        </g>
      </g>
    </g>

    <!-- 3. REVIEWS & COMMUNITY RATINGS SECTION -->
    <g id="ReviewsSection" transform="translate(0, 700)">
      <text x="0" y="30" fill="#0F172A" font-size="22" font-weight="900">리뷰 (3)</text>

      <!-- Review Input Box -->
      <g transform="translate(0, 48)">
        <rect width="880" height="150" rx="24" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1.5"/>
        
        <!-- Rating Stars Selector -->
        <g transform="translate(24, 20)">
          <text x="0" y="18" fill="#F59E0B" font-size="20">★★★★★</text>
          <text x="120" y="16" fill="#64748B" font-size="12" font-weight="600">별점을 선택해주세요</text>
        </g>

        <!-- Input Textarea Placeholder -->
        <rect x="24" y="48" width="832" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="40" y="78" fill="#94A3B8" font-size="13">이 책에 대한 소중한 평을 남겨주세요 (아이 반응, 난이도 등)...</text>

        <!-- Submit Button -->
        <rect x="746" y="106" width="110" height="34" rx="10" fill="#16A34A"/>
        <text x="801" y="128" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">리뷰 등록</text>
      </g>

      <!-- Review Items List -->
      <g transform="translate(0, 218)">
        <!-- Review Item 1 -->
        <g transform="translate(0, 0)">
          <rect width="880" height="96" rx="20" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
          <circle cx="36" cy="36" r="16" fill="#DCFCE7"/>
          <text x="36" y="41" fill="#15803D" font-size="14" font-weight="900" text-anchor="middle">민</text>
          
          <text x="64" y="32" fill="#0F172A" font-size="15" font-weight="800">민준맘</text>
          <text x="120" y="32" fill="#F59E0B" font-size="14">★★★★★</text>
          <text x="844" y="32" fill="#94A3B8" font-size="12" text-anchor="end">2026.08.02</text>

          <text x="64" y="62" fill="#334155" font-size="13">아이가 너무 재미있게 읽었어요! 그림체도 귀엽고 내용도 도전과 용기에 대해 배울 수 있어 아주 만족스럽습니다.</text>
        </g>

        <!-- Review Item 2 -->
        <g transform="translate(0, 110)">
          <rect width="880" height="96" rx="20" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
          <circle cx="36" cy="36" r="16" fill="#DBEAFE"/>
          <text x="36" y="41" fill="#1E40AF" font-size="14" font-weight="900" text-anchor="middle">서</text>
          
          <text x="64" y="32" fill="#0F172A" font-size="15" font-weight="800">서연아빠</text>
          <text x="130" y="32" fill="#F59E0B" font-size="14">★★★★☆</text>
          <text x="844" y="32" fill="#94A3B8" font-size="12" text-anchor="end">2026.07.28</text>

          <text x="64" y="62" fill="#334155" font-size="13">5세 아이가 혼자 읽기에는 글밥이 약간 있지만 잠자리 동화로 읽어주기 딱 좋은 책입니다.</text>
        </g>
      </g>
    </g>

  </g>
</svg>
